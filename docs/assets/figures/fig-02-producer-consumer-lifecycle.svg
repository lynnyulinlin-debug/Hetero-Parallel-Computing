<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">有界任务队列的生产、消费与关闭泳道</title><desc id="desc">生产者提交任务，消费者取走并在锁外计算，关闭方设置标记后唤醒线程，消费者排空已有任务再退出。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 20px sans-serif;fill:#172033}.lane{font:700 18px sans-serif;fill:#1e3a5f}.note{font:700 16px sans-serif;fill:#9a3412}</style>
  <rect width="1200" height="520" fill="#f8fafc"/><text class="title" x="55" y="58">有界任务队列：生产、消费与关闭在不同泳道推进</text><text class="sub" x="55" y="88">状态只在锁内更新；关闭后停止提交，消费者继续排空已入队任务。</text>
  <rect x="55" y="125" width="1090" height="95" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="lane" x="80" y="155">生产者</text><rect x="200" y="142" width="205" height="55" rx="10" fill="#fff" stroke="#60a5fa"/><text class="head" x="235" y="175">满且未关闭则等待</text><path d="M405 170 H455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="142" width="205" height="55" rx="10" fill="#fff" stroke="#60a5fa"/><text class="head" x="500" y="175">锁内写入任务</text><path d="M660 170 H710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="142" width="250" height="55" rx="10" fill="#fff" stroke="#60a5fa"/><text class="head" x="745" y="175">解锁后通知消费者</text><text class="text" x="985" y="175">closed 时停止提交</text>
  <rect x="55" y="245" width="1090" height="95" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="lane" x="80" y="275">消费者</text><rect x="200" y="262" width="205" height="55" rx="10" fill="#fff" stroke="#4ade80"/><text class="head" x="235" y="295">空且未关闭则等待</text><path d="M405 290 H455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="262" width="205" height="55" rx="10" fill="#fff" stroke="#4ade80"/><text class="head" x="500" y="295">锁内取走任务</text><path d="M660 290 H710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="262" width="250" height="55" rx="10" fill="#fff" stroke="#4ade80"/><text class="head" x="765" y="295">解锁后处理任务</text><text class="text" x="985" y="295">队空且 closed 时退出</text>
  <rect x="55" y="365" width="1090" height="95" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="lane" x="80" y="395">关闭方</text><rect x="200" y="382" width="205" height="55" rx="10" fill="#fff" stroke="#fb923c"/><text class="head" x="238" y="415">锁内设置 closed</text><path d="M405 410 H455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="382" width="205" height="55" rx="10" fill="#fff" stroke="#fb923c"/><text class="head" x="487" y="415">解锁后 notify_all</text><path d="M660 410 H710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="382" width="300" height="55" rx="10" fill="#fff" stroke="#fb923c"/><text class="head" x="750" y="415">消费者排空后退出并汇合</text>
  <text class="note" x="200" y="495">共同规则：被唤醒后重新检查谓词；只有队列状态变化时才在锁内更新 count 和 closed。</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
</svg>
