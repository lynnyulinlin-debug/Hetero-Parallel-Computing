<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">并行化判断的核心模型</title><desc id="desc">可拆分工作被多个执行资源处理，串行和协调成本限制收益，正确性与测量口径用于验证结论。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.note{font:700 17px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">并行化判断：工作、资源、成本与证据必须连成闭环</text><text class="sub" x="55" y="88">先确认工作能拆，再确认资源有活可做，最后用正确性和测量验证收益。</text><rect x="70" y="155" width="230" height="115" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="115" y="198">可拆分工作</text><text class="text" x="100" y="235">单元、依赖、数据位置</text><path d="M300 212 H370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="155" width="230" height="115" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="415" y="198">执行资源</text><text class="text" x="400" y="235">核心、向量单元、加速器</text><path d="M600 212 H670" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="155" width="200" height="115" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="712" y="198">实际收益</text><text class="text" x="700" y="235">吞吐或完成时间</text><rect x="930" y="155" width="200" height="115" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="970" y="198">验证证据</text><text class="text" x="958" y="235">正确性与测量口径</text><path d="M870 212 H930" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="330" width="540" height="45" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text class="note" x="390" y="360">串行阶段、同步和搬运成本会限制实际收益</text><path d="M770 270 V330" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#cost)"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker><marker id="cost" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#dc2626"/></marker></defs></svg>
