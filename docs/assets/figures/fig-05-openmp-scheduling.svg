<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="OpenMP scheduling"><style>.bg{fill:#f8f7f2}.p{fill:#fff;stroke:#d6d3c7;stroke-width:2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.g{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}</style><rect class="bg" width="1100" height="440" rx="24"/><text class="t h" x="45" y="55">OpenMP Scheduling: Static, Dynamic, Guided</text><text class="t s" x="45" y="82">Different schedules trade dispatch overhead for load balance when loop iterations have unequal cost.</text><g transform="translate(55 125)"><rect class="p" width="300" height="240" rx="14"/><text class="t l" x="25" y="40">static</text><rect class="b" x="30" y="75" width="210" height="28"/><rect class="o" x="30" y="115" width="210" height="28"/><rect class="g" x="30" y="155" width="210" height="28"/><text class="t s" x="35" y="222">fixed chunks, lowest overhead</text></g><g transform="translate(400 125)"><rect class="p" width="300" height="240" rx="14"/><text class="t l" x="25" y="40">dynamic</text><rect class="b" x="30" y="75" width="90" height="28"/><rect class="o" x="125" y="75" width="65" height="28"/><rect class="g" x="195" y="75" width="45" height="28"/><rect class="o" x="30" y="115" width="55" height="28"/><rect class="g" x="90" y="115" width="120" height="28"/><text class="t s" x="35" y="222">workers pull next chunk</text></g><g transform="translate(745 125)"><rect class="p" width="300" height="240" rx="14"/><text class="t l" x="25" y="40">guided</text><rect class="b" x="30" y="75" width="170" height="28"/><rect class="o" x="30" y="115" width="110" height="28"/><rect class="g" x="30" y="155" width="55" height="28"/><text class="t s" x="35" y="222">large chunks first, then smaller</text></g></svg>
