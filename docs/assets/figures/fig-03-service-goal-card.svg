<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">服务目标决定批处理与验证证据</title><desc id="desc">低延迟服务减少排队和关键路径，高吞吐服务使用受控批处理并记录窗口完成量。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">先确定服务目标，再选择批处理与测量证据</text><text class="sub" x="55" y="88">同一推理服务可在不同目标下采用不同队列和 batch 策略。</text><rect x="85" y="150" width="430" height="170" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="120" y="190">优先低延迟</text><text class="text" x="120" y="225">策略：限制排队，缩短关键路径</text><text class="text" x="120" y="255">证据：L_e2e、P95、队列等待</text><text class="out" x="120" y="290">适用：交互、实时控制</text><rect x="685" y="150" width="430" height="170" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="720" y="190">优先高吞吐</text><text class="text" x="720" y="225">策略：受控 batch，提高利用率</text><text class="text" x="720" y="255">证据：完成量 / 统计窗口、成本</text><text class="out" x="720" y="290">适用：离线分析、批量推理</text><path d="M515 235 H685" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/><text class="text" x="550" y="215">目标取舍</text></svg>
