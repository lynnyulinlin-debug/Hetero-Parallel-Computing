<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">第 3 章学习路线</title><desc id="desc">从基本模式到组合、目标、候选执行位置，最终形成模式选择记录卡。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 20px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="400" fill="#f8fafc"/><text class="title" x="55" y="58">第 3 章：从工作模式到可验证的实现候选</text><text class="sub" x="55" y="88">先描述数据与阶段关系，再确定系统目标和候选执行位置。</text><rect x="45" y="150" width="195" height="100" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="75" y="190">1. 基本模式</text><text class="text" x="70" y="220">输入输出关系</text><path d="M240 200 H280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="280" y="150" width="195" height="100" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="310" y="190">2. 组合关系</text><text class="text" x="305" y="220">阶段与数据块</text><path d="M475 200 H515" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="150" width="195" height="100" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="545" y="190">3. 服务目标</text><text class="text" x="540" y="220">吞吐或延迟</text><path d="M710 200 H750" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="150" width="195" height="100" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="780" y="190">4. 候选位置</text><text class="text" x="775" y="220">约束与工具链</text><path d="M945 200 H985" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="985" y="150" width="160" height="100" rx="15" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text class="head" x="1005" y="190">5. 记录卡</text><text class="text" x="1005" y="220">验证证据</text><rect x="350" y="305" width="500" height="52" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="out" x="450" y="338">产出：模式选择记录卡 -> 第 4 章 Host 实现</text><path d="M1065 250 V305 H850" stroke="#1e3a5f" stroke-width="3" marker-end="url(#out)"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker><marker id="out" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1e3a5f"/></marker></defs></svg>
