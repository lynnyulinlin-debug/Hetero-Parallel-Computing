<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="Thread pool flow"><style>.bg{fill:#f8f7f2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.g{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs><rect class="bg" width="1100" height="440" rx="24"/><text class="t h" x="45" y="55">Thread Pool: Queue, Workers, Completion</text><rect class="b" x="70" y="165" width="160" height="100" rx="12"/><text class="t l" x="105" y="205">Producer</text><text class="t s" x="97" y="232">submit tasks</text><rect class="o" x="355" y="135" width="190" height="160" rx="12"/><text class="t l" x="405" y="180">Task Queue</text><text class="t s" x="385" y="210">mutex protects queue</text><text class="t s" x="385" y="235">condition wakes workers</text><rect class="g" x="700" y="105" width="150" height="65" rx="10"/><rect class="g" x="700" y="190" width="150" height="65" rx="10"/><rect class="g" x="700" y="275" width="150" height="65" rx="10"/><text class="t s" x="735" y="145">worker 0</text><text class="t s" x="735" y="230">worker 1</text><text class="t s" x="735" y="315">worker N</text><path class="a" d="M230 215H340"/><path class="a" d="M545 175H685"/><path class="a" d="M545 215H685"/><path class="a" d="M545 255H685"/><text class="t s" x="70" y="380">The pool amortizes thread creation. Correctness depends on queue ownership, wakeup rules, and a clear shutdown path.</text></svg>
