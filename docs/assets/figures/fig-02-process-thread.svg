<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="Process and thread boundaries"><style>.bg{fill:#f8f7f2}.p{fill:#fff;stroke:#d6d3c7;stroke-width:2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}</style><rect class="bg" width="1100" height="440" rx="24"/><text class="t h" x="45" y="55">Process and Thread: Resource Boundaries</text><rect class="p" x="50" y="100" width="450" height="280" rx="16"/><text class="t l" x="80" y="140">Two processes</text><rect class="b" x="85" y="180" width="155" height="145" rx="10"/><rect class="b" x="300" y="180" width="155" height="145" rx="10"/><text class="t l" x="112" y="215">Process A</text><text class="t s" x="105" y="245">own address space</text><text class="t s" x="105" y="270">own resources</text><text class="t l" x="327" y="215">Process B</text><text class="t s" x="320" y="245">own address space</text><text class="t s" x="320" y="270">own resources</text><text class="t s" x="80" y="355">Isolation is strong; communication needs an explicit boundary.</text><rect class="p" x="600" y="100" width="450" height="280" rx="16"/><text class="t l" x="630" y="140">One process, multiple threads</text><rect class="o" x="635" y="175" width="380" height="145" rx="10"/><rect class="b" x="665" y="210" width="75" height="70" rx="8"/><rect class="b" x="785" y="210" width="75" height="70" rx="8"/><rect class="b" x="905" y="210" width="75" height="70" rx="8"/><text class="t s" x="680" y="248">T0</text><text class="t s" x="800" y="248">T1</text><text class="t s" x="920" y="248">T2</text><text class="t s" x="650" y="300">shared address space and resources</text><text class="t s" x="630" y="355">Sharing is cheap; visibility and synchronization become necessary.</text></svg>
