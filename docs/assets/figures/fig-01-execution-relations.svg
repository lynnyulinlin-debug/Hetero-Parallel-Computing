<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">依赖、并发、并行与关键路径</title>
  <desc id="desc">两个视频帧的预处理可并发组织并在两个执行资源上并行完成，结果汇聚前的依赖链构成关键路径。</desc>
  <style>
    .title { font: 700 28px sans-serif; fill: #172033; }
    .sub { font: 17px sans-serif; fill: #475569; }
    .head { font: 700 21px sans-serif; fill: #172033; }
    .text { font: 17px sans-serif; fill: #334155; }
    .tag { font: 700 16px sans-serif; fill: #ffffff; }
  </style>
  <rect width="1200" height="470" fill="#f8fafc"/>
  <text class="title" x="55" y="55">先区分执行关系：依赖决定顺序，并发组织工作，并行使用资源</text>
  <text class="sub" x="55" y="86">视频分析中，不同帧可独立预处理；每帧内部仍要沿依赖链完成，最后再汇聚结果。</text>

  <rect x="60" y="125" width="155" height="54" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="95" y="159">帧 A 输入</text>
  <rect x="60" y="220" width="155" height="54" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="95" y="254">帧 B 输入</text>
  <path d="M215 152 H285" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M275 144 L285 152 L275 160" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M215 247 H285" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M275 239 L285 247 L275 255" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="285" y="125" width="185" height="54" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="head" x="324" y="159">预处理 A</text>
  <rect x="285" y="220" width="185" height="54" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="head" x="324" y="254">预处理 B</text>
  <path d="M470 152 H540 V310 H625" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M470 247 H540 V310 H625" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M615 302 L625 310 L615 318" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="625" y="282" width="180" height="56" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="head" x="662" y="317">结果汇聚</text>
  <text class="text" x="60" y="374">依赖：同一帧的输入、处理和结果必须按顺序发生。</text>
  <text class="text" x="60" y="405">关键路径：一条结果从输入到汇聚必须走完的最长依赖链。</text>

  <rect x="850" y="125" width="285" height="74" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <rect x="870" y="140" width="68" height="25" rx="12" fill="#7c3aed"/>
  <text class="tag" x="884" y="158">并发</text>
  <text class="head" x="870" y="188">帧 A 与帧 B 可交错推进</text>
  <rect x="850" y="235" width="285" height="74" rx="14" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <rect x="870" y="250" width="68" height="25" rx="12" fill="#0891b2"/>
  <text class="tag" x="884" y="268">并行</text>
  <text class="head" x="870" y="298">两个资源可同时处理两帧</text>
  <text class="text" x="850" y="364">并发不要求多个核心；并行要求存在可同时执行的独立工作。</text>
</svg>
