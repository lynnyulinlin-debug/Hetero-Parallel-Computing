<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">从模式与约束到候选执行位置</title><desc id="desc">模式、服务目标、数据约束和工具链前提共同形成 CPU、GPU、NPU 的候选，再用对应证据验证。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="430" fill="#f8fafc"/><text class="title" x="55" y="58">候选执行位置来自约束组合，不来自设备名称</text><text class="sub" x="55" y="88">先记录模式、目标、数据和工具链，再比较 CPU、GPU、NPU 候选。</text><rect x="65" y="150" width="230" height="120" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="95" y="190">工作模式</text><text class="text" x="95" y="225">Map、Reduce、阶段依赖</text><rect x="335" y="150" width="230" height="120" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="365" y="190">服务目标</text><text class="text" x="365" y="225">延迟、吞吐、功耗</text><rect x="605" y="150" width="230" height="120" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="635" y="190">数据约束</text><text class="text" x="635" y="225">布局、搬运、内存容量</text><rect x="875" y="150" width="230" height="120" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="905" y="190">工具链前提</text><text class="text" x="905" y="225">编译、转换、运行时</text><rect x="335" y="330" width="530" height="52" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="out" x="430" y="363">候选：CPU / GPU / NPU -> 用对应证据验证</text><path d="M180 270 V330 H600 M450 270 V330 M720 270 V330 M990 270 V330 H600" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs></svg>
