<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
 <title id="title">compiler auto vectorization</title><desc id="desc">A compiler checks loop dependencies and memory access before converting scalar iterations into SIMD vector instructions.</desc>
 <style>text{font-family:Arial,sans-serif;fill:#18324a}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.code{font-family:monospace;font-size:16px;fill:#234e69}.note{font-size:14px;fill:#527084}.scalar{fill:#e5f1f9;stroke:#2979a9;stroke-width:2}.proof{fill:#fff0dc;stroke:#dc861f;stroke-width:2}.vector{fill:#eef4e4;stroke:#619243;stroke-width:2}.line{fill:none;stroke:#6d8291;stroke-width:3}.arrow{fill:#6d8291}</style>
 <rect width="960" height="330" fill="#f8f7f2"/><text x="42" y="49" class="title">From a scalar loop to SIMD instructions</text>
 <rect x="50" y="100" width="225" height="112" rx="10" class="scalar"/><text x="72" y="132" class="code">for (i = 0; i &lt; n; i++)</text><text x="84" y="157" class="code">y[i] = a[i] + b[i];</text><text x="77" y="190" class="note">independent scalar iterations</text>
 <rect x="378" y="100" width="196" height="112" rx="10" class="proof"/><text x="424" y="134" class="label">Compiler proof</text><text x="405" y="161" class="note">no loop dependency</text><text x="405" y="184" class="note">regular memory access</text>
 <rect x="676" y="100" width="230" height="112" rx="10" class="vector"/><text x="715" y="134" class="label">vector loop</text><text x="701" y="161" class="code">load 4 values</text><text x="701" y="184" class="code">add / store 4 values</text>
 <path d="M275 156h82" class="line"/><path d="M357 156l-12-7v14z" class="arrow"/><path d="M574 156h81" class="line"/><path d="M655 156l-12-7v14z" class="arrow"/>
 <text x="50" y="267" class="note">Use optimization reports to confirm the transformation; omp simd, restrict and alignment information provide useful evidence.</text>
</svg>
