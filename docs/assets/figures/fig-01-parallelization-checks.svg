<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">并行化前的五步判断</title><desc id="desc">从独立工作单元开始，依次确认依赖、粒度、数据路径和验证方式。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 20px sans-serif;fill:#172033}.num{font:700 17px sans-serif;fill:#fff}</style>
  <rect width="1200" height="440" fill="#f8fafc"/><text class="title" x="55" y="58">并行化不是先选线程数，而是先完成五步判断</text><text class="sub" x="55" y="88">每一步都为下一步提供前提；发现约束后，应回到该步处理，而不是直接增加资源。</text>
  <g transform="translate(55 155)"><rect width="190" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#2563eb"/><text class="num" x="25" y="36">1</text><text class="head" x="58" y="37">独立工作</text><text class="text" x="28" y="76">最小单元是什么？</text></g><path d="M245 205h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(310 155)"><rect width="190" height="100" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#16a34a"/><text class="num" x="25" y="36">2</text><text class="head" x="58" y="37">依赖关系</text><text class="text" x="28" y="76">谁必须等待？</text></g><path d="M500 205h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(565 155)"><rect width="190" height="100" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#ea580c"/><text class="num" x="25" y="36">3</text><text class="head" x="58" y="37">任务粒度</text><text class="text" x="28" y="76">开销能否摊薄？</text></g><path d="M755 205h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(820 155)"><rect width="190" height="100" rx="14" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#9333ea"/><text class="num" x="25" y="36">4</text><text class="head" x="58" y="37">数据路径</text><text class="text" x="28" y="76">数据怎样移动？</text></g><path d="M915 255 V295" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g transform="translate(820 300)"><rect width="190" height="100" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><circle cx="30" cy="30" r="17" fill="#0284c7"/><text class="num" x="25" y="36">5</text><text class="head" x="58" y="37">验证口径</text><text class="text" x="28" y="76">怎样证明收益？</text></g>
  <text class="text" x="55" y="365">输出：可用于后续模式选择、实现和测量的并行化判断卡。</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
</svg>
