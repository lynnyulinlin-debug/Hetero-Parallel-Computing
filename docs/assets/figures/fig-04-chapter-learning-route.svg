<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">第4章学习路线</title><desc id="desc">第4章依次建立 pthread 生命周期、线程池任务交接和选择边界，最终形成任务生命周期记录。</desc><style>.t{font:700 28px sans-serif;fill:#172033}.h{font:700 21px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}</style><rect width="1200" height="300" fill="#f8fafc"/><text class="t" x="55" y="55">第4章：从显式线程到任务生命周期</text><text class="s" x="55" y="85">先理解线程责任，再用线程池承载任务，最后按工作形态选择模型。</text><rect x="55" y="135" width="240" height="90" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="h" x="94" y="175">4.1 pthread</text><text class="s" x="82" y="205">创建、传参、汇合</text><path d="M295 180H365" fill="none" stroke="#64748b" stroke-width="3"/><path d="M355 172L365 180L355 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="365" y="135" width="240" height="90" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="h" x="405" y="175">4.2 线程池</text><text class="s" x="392" y="205">队列、等待、关闭</text><path d="M605 180H675" fill="none" stroke="#64748b" stroke-width="3"/><path d="M665 172L675 180L665 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="675" y="135" width="240" height="90" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="h" x="700" y="175">4.3 选择边界</text><text class="s" x="696" y="205">任务模型或循环模型</text><path d="M915 180H985" fill="none" stroke="#64748b" stroke-width="3"/><path d="M975 172L985 180L975 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="985" y="135" width="160" height="90" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="h" x="1015" y="175">产出</text><text class="s" x="1000" y="205">任务生命周期记录</text></svg>
