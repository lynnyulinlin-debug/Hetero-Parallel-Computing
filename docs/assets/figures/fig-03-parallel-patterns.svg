<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">四种可复用并行模式</title><desc id="desc">映射、归约、分发和汇聚分别表达不同的数据与结果关系。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 22px sans-serif;fill:#172033}</style>
  <rect width="1200" height="470" fill="#f8fafc"/><text class="title" x="55" y="58">先识别数据依赖，再选择并行模式</text><text class="sub" x="55" y="88">每个模式只回答一种关系：独立处理、合并结果、分发工作或汇聚结果。</text>
  <g transform="translate(55 145)"><rect width="250" height="230" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="28" y="42">映射（Map）</text><rect x="28" y="75" width="44" height="36" rx="7" fill="#bfdbfe"/><rect x="102" y="75" width="44" height="36" rx="7" fill="#bfdbfe"/><rect x="176" y="75" width="44" height="36" rx="7" fill="#bfdbfe"/><path d="M50 120v35m74-35v35m74-35v35" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="165" width="44" height="36" rx="7" fill="#dbeafe"/><rect x="102" y="165" width="44" height="36" rx="7" fill="#dbeafe"/><rect x="176" y="165" width="44" height="36" rx="7" fill="#dbeafe"/><text class="text" x="28" y="220">同一操作处理独立元素</text></g>
  <g transform="translate(335 145)"><rect width="250" height="230" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="28" y="42">归约（Reduce）</text><rect x="28" y="75" width="44" height="36" rx="7" fill="#bbf7d0"/><rect x="102" y="75" width="44" height="36" rx="7" fill="#bbf7d0"/><rect x="176" y="75" width="44" height="36" rx="7" fill="#bbf7d0"/><path d="M50 120 L125 165 M124 120v45 M198 120 L125 165" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="103" y="170" width="44" height="36" rx="7" fill="#dcfce7"/><text class="text" x="28" y="220">多个部分结果合成一个值</text></g>
  <g transform="translate(615 145)"><rect width="250" height="230" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="28" y="42">分发（Scatter）</text><rect x="103" y="75" width="44" height="36" rx="7" fill="#fed7aa"/><path d="M125 120 L50 165 M125 120v45 M125 120 L198 165" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="170" width="44" height="36" rx="7" fill="#ffedd5"/><rect x="103" y="170" width="44" height="36" rx="7" fill="#ffedd5"/><rect x="176" y="170" width="44" height="36" rx="7" fill="#ffedd5"/><text class="text" x="28" y="220">把工作或数据交给多个执行者</text></g>
  <g transform="translate(895 145)"><rect width="250" height="230" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="28" y="42">汇聚（Gather）</text><rect x="28" y="75" width="44" height="36" rx="7" fill="#e9d5ff"/><rect x="102" y="75" width="44" height="36" rx="7" fill="#e9d5ff"/><rect x="176" y="75" width="44" height="36" rx="7" fill="#e9d5ff"/><path d="M50 120 L125 165 M124 120v45 M198 120 L125 165" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow)"/><rect x="103" y="170" width="44" height="36" rx="7" fill="#f3e8ff"/><text class="text" x="28" y="220">把分散结果收回输出边界</text></g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>
