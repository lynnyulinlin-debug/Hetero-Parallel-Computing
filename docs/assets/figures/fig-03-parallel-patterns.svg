<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Map Reduce Scatter Gather patterns">
<style>.bg{fill:#f8f7f2}.p{fill:#fff;stroke:#d6d3c7;stroke-width:2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.g{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs>
<rect class="bg" width="1200" height="520" rx="24"/><text class="t h" x="50" y="60">Reusable Parallel Patterns</text><text class="t s" x="50" y="88">Choose the pattern from data dependencies before choosing threads or devices.</text>
<g transform="translate(55 130)"><rect class="p" width="250" height="310" rx="16"/><text class="t l" x="28" y="42">Map</text><rect class="b" x="25" y="85" width="65" height="38" rx="6"/><rect class="b" x="25" y="145" width="65" height="38" rx="6"/><rect class="b" x="25" y="205" width="65" height="38" rx="6"/><path class="a" d="M100 104H145M100 164H145M100 224H145"/><rect class="o" x="155" y="85" width="65" height="38" rx="6"/><rect class="o" x="155" y="145" width="65" height="38" rx="6"/><rect class="o" x="155" y="205" width="65" height="38" rx="6"/><text class="t s" x="28" y="280">Same operation on</text><text class="t s" x="28" y="300">independent elements.</text></g>
<g transform="translate(330 130)"><rect class="p" width="250" height="310" rx="16"/><text class="t l" x="28" y="42">Reduce</text><rect class="b" x="25" y="85" width="48" height="34" rx="6"/><rect class="b" x="25" y="140" width="48" height="34" rx="6"/><rect class="b" x="25" y="195" width="48" height="34" rx="6"/><path class="a" d="M83 102H125M83 157H125M83 212H125"/><rect class="o" x="135" y="120" width="60" height="60" rx="8"/><path class="a" d="M205 150H220"/><rect class="g" x="220" y="130" width="20" height="40" rx="4"/><text class="t s" x="28" y="280">Combine many values</text><text class="t s" x="28" y="300">into one result.</text></g>
<g transform="translate(605 130)"><rect class="p" width="250" height="310" rx="16"/><text class="t l" x="28" y="42">Scatter</text><rect class="b" x="25" y="135" width="55" height="55" rx="8"/><path class="a" d="M90 162H135M90 162L135 102M90 162L135 222"/><rect class="o" x="145" y="83" width="65" height="35" rx="6"/><rect class="o" x="145" y="145" width="65" height="35" rx="6"/><rect class="o" x="145" y="207" width="65" height="35" rx="6"/><text class="t s" x="28" y="280">Split work or data</text><text class="t s" x="28" y="300">to parallel consumers.</text></g>
<g transform="translate(880 130)"><rect class="p" width="250" height="310" rx="16"/><text class="t l" x="28" y="42">Gather</text><rect class="b" x="25" y="83" width="65" height="35" rx="6"/><rect class="b" x="25" y="145" width="65" height="35" rx="6"/><rect class="b" x="25" y="207" width="65" height="35" rx="6"/><path class="a" d="M100 102L145 162M100 162H145M100 222L145 162"/><rect class="g" x="155" y="135" width="55" height="55" rx="8"/><text class="t s" x="28" y="280">Merge partial results</text><text class="t s" x="28" y="300">at an output boundary.</text></g>
</svg>
