<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">场景目标决定并行证据</title><desc id="desc">不同场景的工作结构可拆分，但性能目标决定需要记录的证据。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">负载结构相似，优化证据仍由场景目标决定</text><text class="sub" x="55" y="88">先确认可拆分工作，再为主要目标选择测量证据。</text><rect x="60" y="155" width="220" height="125" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="105" y="195">科学计算</text><text class="text" x="90" y="230">目标：迭代规模与误差</text><text class="text" x="90" y="258">证据：完成时间、精度</text><rect x="340" y="155" width="220" height="125" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="415" y="195">AI</text><text class="text" x="370" y="230">目标：吞吐与显存</text><text class="text" x="370" y="258">证据：tokens/s、内存</text><rect x="620" y="155" width="220" height="125" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="685" y="195">图形</text><text class="text" x="650" y="230">目标：帧率与时延</text><text class="text" x="650" y="258">证据：帧时间、P95</text><rect x="900" y="155" width="220" height="125" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="945" y="195">数据处理</text><text class="text" x="930" y="230">目标：批处理与容错</text><text class="text" x="930" y="258">证据：吞吐、失败率</text><text class="text" x="285" y="355">共同前提：工作规模、重复计算和相对独立的工作单元。</text></svg>
