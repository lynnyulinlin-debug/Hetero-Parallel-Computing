<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="GEMM tile and shared memory reuse">
<style>.bg{fill:#f8f7f2}.p{fill:#fff;stroke:#d6d3c7;stroke-width:2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.g{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs>
<rect class="bg" width="1200" height="580" rx="24"/><text class="t h" x="50" y="60">GEMM Tiling: Load Once, Reuse Many Times</text><text class="t s" x="50" y="88">A block cooperatively loads tiles of A and B into shared memory, then reuses them for many multiply-accumulate operations.</text>
<rect class="p" x="55" y="130" width="300" height="350" rx="16"/><text class="t l" x="85" y="170">Global memory</text><rect class="b" x="100" y="215" width="90" height="180"/><rect class="o" x="215" y="215" width="90" height="180"/><rect class="g" x="100" y="275" width="90" height="60"/><rect class="g" x="215" y="275" width="90" height="60"/><text class="t s" x="125" y="245">A</text><text class="t s" x="240" y="245">B</text><text class="t s" x="105" y="430">highlighted tiles</text>
<path class="a" d="M355 305H445"/><rect class="p" x="465" y="130" width="300" height="350" rx="16"/><text class="t l" x="495" y="170">Shared memory (one block)</text><rect class="g" x="520" y="225" width="80" height="110" rx="8"/><rect class="g" x="630" y="225" width="80" height="110" rx="8"/><text class="t s" x="535" y="275">tile A</text><text class="t s" x="645" y="275">tile B</text><text class="t s" x="515" y="385">block threads synchronize</text><text class="t s" x="515" y="407">before reuse</text>
<path class="a" d="M765 305H855"/><rect class="p" x="875" y="130" width="270" height="350" rx="16"/><text class="t l" x="905" y="170">Thread compute</text><rect class="o" x="945" y="235" width="130" height="90" rx="10"/><text class="t l" x="980" y="278">C tile</text><text class="t s" x="915" y="370">each loaded value is</text><text class="t s" x="915" y="392">reused across MACs</text><text class="t s" x="915" y="430">less global traffic</text>
</svg>
