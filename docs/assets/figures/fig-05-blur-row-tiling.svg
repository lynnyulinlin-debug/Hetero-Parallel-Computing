<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
 <title id="title">OpenMP image blur row tiling</title><desc id="desc">Rows are divided between threads; each output row reads a neighboring halo but writes a disjoint output range.</desc>
 <style>text{font-family:Arial,sans-serif;fill:#18324a}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:14px;fill:#527084}.grid{stroke:#fff;stroke-width:2}.halo{fill:#dce8ed}.t0{fill:#5aa6c8}.t1{fill:#dc9b43}.t2{fill:#74a96d}.out{fill:#edf4e9;stroke:#619243;stroke-width:2}.arrow{fill:#6d8291}.line{fill:none;stroke:#6d8291;stroke-width:2}</style>
 <rect width="960" height="350" fill="#f8f7f2"/><text x="42" y="49" class="title">Image blur: disjoint output rows, shared read halos</text>
 <text x="100" y="87" class="label">input image</text><g class="grid"><rect x="100" y="103" width="420" height="30" class="halo"/><rect x="100" y="133" width="420" height="48" class="t0"/><rect x="100" y="181" width="420" height="48" class="t1"/><rect x="100" y="229" width="420" height="48" class="t2"/><rect x="100" y="277" width="420" height="30" class="halo"/></g>
 <text x="550" y="119" class="label">Thread 0</text><text x="550" y="162" class="note">reads rows 0..2</text><text x="550" y="206" class="label">Thread 1</text><text x="550" y="249" class="note">reads rows 2..4</text><text x="550" y="293" class="label">Thread 2</text>
 <path d="M520 157h20" class="line"/><path d="M540 157l-9-5v10z" class="arrow"/><path d="M520 205h20" class="line"/><path d="M540 205l-9-5v10z" class="arrow"/><path d="M520 253h20" class="line"/><path d="M540 253l-9-5v10z" class="arrow"/>
 <rect x="746" y="130" width="150" height="130" rx="10" class="out"/><text x="776" y="162" class="label">output</text><text x="763" y="188" class="note">each thread writes</text><text x="765" y="211" class="note">different rows</text><text x="780" y="237" class="note">no race</text>
 <text x="100" y="334" class="note">Boundary rows require special handling; interior row tiles are independent and map naturally to parallel-for scheduling.</text>
</svg>
