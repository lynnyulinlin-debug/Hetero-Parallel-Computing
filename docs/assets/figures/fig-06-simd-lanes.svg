<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="SIMD lanes"><style>.bg{fill:#f8f7f2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.g{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs><rect class="bg" width="1100" height="440" rx="24"/><text class="t h" x="45" y="55">SIMD: One Instruction, Multiple Lanes</text><text class="t s" x="45" y="82">Vectorization works when data is regular, independent, and laid out for contiguous loads.</text><text class="t l" x="85" y="145">Scalar</text><g transform="translate(85 175)"><rect class="b" width="80" height="45" rx="6"/><rect class="b" x="100" width="80" height="45" rx="6"/><rect class="b" x="200" width="80" height="45" rx="6"/><rect class="b" x="300" width="80" height="45" rx="6"/><text class="t s" x="0" y="75">four instructions over time</text></g><path class="a" d="M485 195H595"/><text class="t l" x="680" y="145">SIMD vector</text><g transform="translate(680 175)"><rect class="g" width="95" height="55" rx="6"/><rect class="g" x="97" width="95" height="55" rx="6"/><rect class="g" x="194" width="95" height="55" rx="6"/><rect class="g" x="291" width="95" height="55" rx="6"/><text class="t s" x="0" y="85">one vector instruction</text></g><rect class="o" x="330" y="315" width="440" height="55" rx="10"/><text class="t s" x="360" y="348">load contiguous values -> compute lanes -> store contiguous values</text></svg>
