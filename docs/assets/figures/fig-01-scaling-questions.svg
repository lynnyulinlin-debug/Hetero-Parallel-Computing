<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">固定规模与规模增长的并行评估</title><desc id="desc">固定规模关注同一任务的加速上限，规模增长关注新增资源能承接多大任务。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 22px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="400" fill="#f8fafc"/><text class="title" x="55" y="58">评估并行收益前，先固定比较问题</text><text class="sub" x="55" y="88">两条定律回答不同问题，不能用同一组数字混合解释。</text><rect x="90" y="145" width="430" height="155" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="125" y="190">固定问题规模</text><text class="text" x="125" y="225">输入不变，增加线程或处理器</text><text class="out" x="125" y="265">问：同一任务最多快多少？</text><text class="text" x="125" y="290">先找串行尾巴与协调成本</text><rect x="680" y="145" width="430" height="155" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="715" y="190">问题规模随资源增长</text><text class="text" x="715" y="225">更多资源配合更大输入或 batch</text><text class="out" x="715" y="265">问：同一预算能做多大任务？</text><text class="text" x="715" y="290">记录规模、吞吐和服务目标</text><path d="M520 222 H680" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text class="text" x="548" y="205">改变比较尺度</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs></svg>
