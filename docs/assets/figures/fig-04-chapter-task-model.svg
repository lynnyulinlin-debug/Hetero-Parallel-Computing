<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">线程与任务的最小执行模型</title><desc id="desc">主线程向有界队列提交帧预处理任务，工作线程在锁外执行，关闭后队列排空并汇合线程。</desc><style>.t{font:700 28px sans-serif;fill:#172033}.h{font:700 21px sans-serif;fill:#172033}.s{font:17px sans-serif;fill:#475569}</style><rect width="1200" height="300" fill="#f8fafc"/><text class="t" x="55" y="55">线程提供执行资源，任务提供持续工作</text><text class="s" x="55" y="85">锁保护队列状态；工作线程取走任务后在锁外执行，关闭时再排空并汇合。</text><rect x="55" y="135" width="210" height="90" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="h" x="95" y="175">采集 / 主线程</text><text class="s" x="90" y="205">提交帧预处理任务</text><path d="M265 180H340" fill="none" stroke="#64748b" stroke-width="3"/><path d="M330 172L340 180L330 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="340" y="115" width="270" height="130" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="h" x="410" y="165">有界任务队列</text><text class="s" x="375" y="200">状态、等待谓词、关闭标记</text><path d="M610 155H690" fill="none" stroke="#64748b" stroke-width="3"/><path d="M680 147L690 155L680 163" fill="none" stroke="#64748b" stroke-width="3"/><path d="M610 205H690" fill="none" stroke="#64748b" stroke-width="3"/><path d="M680 197L690 205L680 213" fill="none" stroke="#64748b" stroke-width="3"/><rect x="690" y="115" width="200" height="65" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="h" x="730" y="156">工作线程 A</text><rect x="690" y="190" width="200" height="65" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="h" x="730" y="231">工作线程 B</text><rect x="965" y="150" width="180" height="75" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text class="h" x="1000" y="190">锁外计算</text><text class="s" x="1000" y="215">独占任务数据</text><text class="s" x="55" y="275">关闭：停止新提交 -> 唤醒等待线程 -> 排空队列 -> join 汇合。</text></svg>
