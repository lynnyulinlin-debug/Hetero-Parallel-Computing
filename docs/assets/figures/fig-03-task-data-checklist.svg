<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">任务并行与数据并行的双层检查卡</title><desc id="desc">任务并行检查阶段依赖和队列节奏，数据并行检查分块、布局和归约，先定位主导层。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">双层检查：先定位控制面还是计算面在限制系统</text><text class="sub" x="55" y="88">两类并行可嵌套，但需要分别记录约束与证据。</text><rect x="90" y="150" width="430" height="165" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="125" y="190">任务并行：阶段与控制流</text><text class="text" x="125" y="225">检查：阶段依赖、队列长度、背压、速率差</text><text class="out" x="125" y="270">主导时：先调整阶段边界与调度</text><rect x="680" y="150" width="430" height="165" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="715" y="190">数据并行：同构计算与数据流</text><text class="text" x="715" y="225">检查：分块均衡、布局、搬运、归约</text><text class="out" x="715" y="270">主导时：先调整切分与数据路径</text><path d="M520 232 H680" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/><text class="text" x="558" y="215">可嵌套</text></svg>
