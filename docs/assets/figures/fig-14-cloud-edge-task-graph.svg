<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">云端与边缘端的异构任务图</title>
  <desc id="desc">云端路径将请求经 CPU 预处理分配给多个 GPU 后汇聚；边缘路径将采集、NPU 推理、后处理和输出组成有明确同步点的流水线。</desc>
  <style>
    .bg{fill:#f8f7f2}.panel{fill:#fff;stroke:#d6d3c7;stroke-width:2}.cpu{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.gpu{fill:#fff0df;stroke:#e85d04;stroke-width:2}.npu{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.io{fill:#f0e8ff;stroke:#7c3aed;stroke-width:2}.title{font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#172033}.label{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#172033}.text{font-family:Arial,sans-serif;font-size:15px;font-weight:500;fill:#334155}.small{font-family:Arial,sans-serif;font-size:14px;font-weight:500;fill:#475569}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.sync{stroke:#7c3aed;stroke-width:3;stroke-dasharray:6 6}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="670" rx="24"/>
  <text class="title" x="55" y="60">Cloud and Edge: Same Pattern, Different Constraints</text>
  <text class="small" x="55" y="88">Boxes are stages. Arrows are data dependencies. Dashed lines mark explicit synchronization.</text>
  <rect class="panel" x="55" y="130" width="1090" height="205" rx="16"/>
  <text class="label" x="85" y="170">Cloud: Request Scheduling and Multi-GPU Inference</text>
  <rect class="io" x="95" y="215" width="135" height="70" rx="10"/><text class="text" x="120" y="257">Requests</text>
  <rect class="cpu" x="295" y="215" width="180" height="70" rx="10"/><text class="text" x="325" y="245">CPU Prepare</text><text class="small" x="325" y="268">tokenize / batch</text>
  <rect class="gpu" x="555" y="195" width="145" height="55" rx="10"/><text class="text" x="590" y="228">GPU 0</text>
  <rect class="gpu" x="555" y="270" width="145" height="55" rx="10"/><text class="text" x="590" y="303">GPU 1</text>
  <rect class="cpu" x="800" y="215" width="180" height="70" rx="10"/><text class="text" x="830" y="245">CPU Merge</text><text class="small" x="830" y="268">rank / return</text>
  <path class="arrow" d="M230 250 H280"/><path class="arrow" d="M475 240 C515 220 520 220 540 220"/><path class="arrow" d="M475 260 C515 295 520 295 540 295"/><path class="arrow" d="M700 220 C755 220 755 245 785 245"/><path class="arrow" d="M700 295 C755 295 755 255 785 255"/>
  <line class="sync" x1="750" y1="185" x2="750" y2="325"/><text class="small" x="716" y="180">merge sync</text>
  <rect class="panel" x="55" y="385" width="1090" height="210" rx="16"/>
  <text class="label" x="85" y="425">Edge: Input Pipeline and Low-Latency Inference</text>
  <rect class="io" x="95" y="470" width="150" height="70" rx="10"/><text class="text" x="120" y="500">Camera / RTSP</text><text class="small" x="120" y="524">frames</text>
  <rect class="cpu" x="320" y="470" width="155" height="70" rx="10"/><text class="text" x="350" y="500">CPU Decode</text><text class="small" x="350" y="524">queue A</text>
  <rect class="npu" x="550" y="470" width="155" height="70" rx="10"/><text class="text" x="580" y="500">NPU Infer</text><text class="small" x="580" y="524">queue B</text>
  <rect class="cpu" x="780" y="470" width="155" height="70" rx="10"/><text class="text" x="805" y="500">CPU Post</text><text class="small" x="805" y="524">threshold / logic</text>
  <rect class="io" x="990" y="470" width="120" height="70" rx="10"/><text class="text" x="1015" y="500">Display</text>
  <path class="arrow" d="M245 505 H305"/><path class="arrow" d="M475 505 H535"/><path class="arrow" d="M705 505 H765"/><path class="arrow" d="M935 505 H975"/>
  <text class="small" x="55" y="640">Cloud: batch, queueing, utilization. Edge: local input, queue boundaries, tail latency, power.</text>
</svg>
