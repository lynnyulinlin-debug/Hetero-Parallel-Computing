<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Systolic array data flow">
<style>.bg{fill:#f8f7f2}.cell{fill:#dcf5ed;stroke:#0f766e;stroke-width:2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs>
<rect class="bg" width="1200" height="560" rx="24"/><text class="t h" x="50" y="60">Systolic Array: Regular Dataflow for Matrix Operations</text><text class="t s" x="50" y="88">Inputs stream across a grid of processing elements. Each cell performs multiply-accumulate and forwards data to its neighbor.</text>
<text class="t l" x="90" y="165">A stream</text><text class="t l" x="720" y="145">B stream</text>
<g transform="translate(340 160)"><g><rect class="cell" width="80" height="65" rx="8"/><rect class="cell" x="95" width="80" height="65" rx="8"/><rect class="cell" x="190" width="80" height="65" rx="8"/><rect class="cell" x="285" width="80" height="65" rx="8"/><rect class="cell" y="80" width="80" height="65" rx="8"/><rect class="cell" x="95" y="80" width="80" height="65" rx="8"/><rect class="cell" x="190" y="80" width="80" height="65" rx="8"/><rect class="cell" x="285" y="80" width="80" height="65" rx="8"/><rect class="cell" y="160" width="80" height="65" rx="8"/><rect class="cell" x="95" y="160" width="80" height="65" rx="8"/><rect class="cell" x="190" y="160" width="80" height="65" rx="8"/><rect class="cell" x="285" y="160" width="80" height="65" rx="8"/></g><text class="t s" x="14" y="38">MAC</text><text class="t s" x="109" y="38">MAC</text><text class="t s" x="204" y="38">MAC</text><text class="t s" x="299" y="38">MAC</text></g>
<rect class="b" x="125" y="230" width="130" height="55" rx="8"/><text class="t s" x="160" y="263">A values</text><path class="a" d="M255 258H325"/><path class="a" d="M420 225H500M515 225H595M610 225H690"/>
<rect class="o" x="770" y="100" width="130" height="55" rx="8"/><text class="t s" x="805" y="133">B values</text><path class="a" d="M835 155V215M835 230V295M835 310V375"/>
<text class="t s" x="350" y="455">Each PE accumulates partial sums locally; regular movement favors fixed, dense neural-network operators.</text><text class="t s" x="350" y="480">Irregular control flow or unsupported operators reduce the advantage.</text>
</svg>
