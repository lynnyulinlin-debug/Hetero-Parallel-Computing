<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Deadlock cycle"><style>.bg{fill:#f8f7f2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:18px;font-weight:700}.s{font-size:14px;fill:#475569}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#x)}</style><defs><marker id="x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs><rect class="bg" width="800" height="480" rx="24"/><text class="t h" x="45" y="55">Deadlock: A Circular Wait</text><rect class="b" x="110" y="150" width="150" height="70" rx="12"/><text class="t l" x="150" y="193">Thread A</text><rect class="o" x="540" y="150" width="150" height="70" rx="12"/><text class="t l" x="580" y="193">Lock 2</text><rect class="b" x="110" y="300" width="150" height="70" rx="12"/><text class="t l" x="150" y="343">Thread B</text><rect class="o" x="540" y="300" width="150" height="70" rx="12"/><text class="t l" x="580" y="343">Lock 1</text><path class="a" d="M260 185H525"/><path class="a" d="M615 220V285"/><path class="a" d="M540 335H275"/><path class="a" d="M185 300V235"/><text class="t s" x="320" y="165">A waits for Lock 2</text><text class="t s" x="320" y="360">B waits for Lock 1</text><text class="t s" x="45" y="430">Break the cycle with a consistent lock order, bounded try-lock, or redesigned ownership.</text></svg>
