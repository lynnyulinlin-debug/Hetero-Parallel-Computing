<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">并行模式的核心模型</title><desc id="desc">工作关系和服务目标共同形成候选模式与执行位置，再由验证证据确认。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">模式是连接执行时序与实现选择的中间语言</text><text class="sub" x="55" y="88">先描述工作关系和系统目标，再形成并验证候选实现。</text><rect x="65" y="155" width="230" height="115" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="95" y="195">工作关系</text><text class="text" x="95" y="230">输入输出、依赖、数据流</text><rect x="355" y="155" width="230" height="115" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="395" y="195">模式语言</text><text class="text" x="385" y="230">Map、Reduce、任务、流水</text><rect x="645" y="155" width="230" height="115" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="685" y="195">系统目标</text><text class="text" x="675" y="230">吞吐、延迟、功耗</text><rect x="935" y="155" width="200" height="115" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="965" y="195">候选实现</text><text class="text" x="960" y="230">Host、GPU、NPU</text><path d="M295 212 H355 M585 212 H645 M875 212 H935" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="330" width="500" height="45" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text class="out" x="450" y="360">用正确性、时间线和性能证据验证</text><path d="M1035 270 V330 H850" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs></svg>
