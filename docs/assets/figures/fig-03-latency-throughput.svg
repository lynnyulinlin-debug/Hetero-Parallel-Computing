<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">延迟与吞吐是不同目标</title><desc id="desc">左侧单请求路径优先缩短完成时间，右侧批处理路径接受排队以增加单位时间完成量。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 22px sans-serif;fill:#172033}.note{font:700 18px sans-serif;fill:#1e3a5f}</style>
  <rect width="1200" height="470" fill="#f8fafc"/><text class="title" x="55" y="58">延迟与吞吐：优化目标不同，调度方式也不同</text><text class="sub" x="55" y="88">左边让一个请求尽快完成；右边让更多请求共享一次批处理。</text>
  <rect x="55" y="135" width="510" height="245" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="85" y="177">单请求路径：优先低延迟</text>
  <rect x="85" y="225" width="105" height="54" rx="10" fill="#bfdbfe"/><text class="text" x="109" y="258">准备</text><path d="M190 252h45" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="235" y="225" width="105" height="54" rx="10" fill="#bfdbfe"/><text class="text" x="259" y="258">推理</text><path d="M340 252h45" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="225" width="105" height="54" rx="10" fill="#bfdbfe"/><text class="text" x="409" y="258">返回</text><text class="note" x="85" y="335">关心：这一单何时完成</text>
  <rect x="635" y="135" width="510" height="245" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="665" y="177">批处理路径：优先高吞吐</text>
  <rect x="665" y="225" width="105" height="54" rx="10" fill="#dcfce7"/><text class="text" x="689" y="258">排队</text><path d="M770 252h45" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="815" y="215" width="165" height="74" rx="10" fill="#bbf7d0"/><text class="text" x="845" y="258">一次批量推理</text><path d="M980 252h45" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/><rect x="1025" y="225" width="80" height="54" rx="10" fill="#dcfce7"/><text class="text" x="1041" y="258">完成</text><text class="note" x="665" y="335">关心：每秒完成多少工作</text>
  <text class="text" x="290" y="430">批处理通常提高吞吐，但排队会增加单个请求的等待时间。</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>
