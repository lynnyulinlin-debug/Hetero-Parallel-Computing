<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Latency throughput tradeoff">
<style>.bg{fill:#f8f7f2}.p{fill:#fff;stroke:#d6d3c7;stroke-width:2}.b{fill:#e0ecff;stroke:#2563eb;stroke-width:2}.o{fill:#fff0df;stroke:#e85d04;stroke-width:2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:19px;font-weight:700}.s{font-size:15px;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none}.dot{fill:#e85d04}</style>
<rect class="bg" width="1200" height="520" rx="24"/><text class="t h" x="50" y="60">Latency and Throughput Are Different Objectives</text><text class="t s" x="50" y="88">Batching often improves throughput but may add queueing delay to an individual request.</text>
<rect class="p" x="55" y="125" width="510" height="325" rx="16"/><text class="t l" x="85" y="165">Single-request path</text><line class="line" x1="110" y1="360" x2="500" y2="360"/><line class="line" x1="110" y1="360" x2="110" y2="210"/><text class="t s" x="450" y="390">time</text><text class="t s" x="65" y="220">work</text><rect class="b" x="145" y="290" width="85" height="70" rx="8"/><rect class="o" x="245" y="250" width="85" height="110" rx="8"/><rect class="b" x="345" y="300" width="85" height="60" rx="8"/><text class="t s" x="150" y="325">prepare</text><text class="t s" x="260" y="305">infer</text><text class="t s" x="357" y="334">return</text><text class="t s" x="135" y="420">Optimize this path for low latency.</text>
<rect class="p" x="635" y="125" width="510" height="325" rx="16"/><text class="t l" x="665" y="165">Batched pipeline</text><line class="line" x1="690" y1="360" x2="1080" y2="360"/><line class="line" x1="690" y1="360" x2="690" y2="210"/><text class="t s" x="1030" y="390">time</text><text class="t s" x="645" y="220">work</text><rect class="b" x="725" y="315" width="60" height="45" rx="6"/><rect class="b" x="795" y="315" width="60" height="45" rx="6"/><rect class="b" x="865" y="315" width="60" height="45" rx="6"/><rect class="o" x="755" y="240" width="190" height="70" rx="8"/><text class="t s" x="800" y="282">one larger inference batch</text><circle class="dot" cx="725" cy="290" r="6"/><text class="t s" x="700" y="420">Queueing delay increases,</text><text class="t s" x="700" y="440">but completed work per second rises.</text>
</svg>
