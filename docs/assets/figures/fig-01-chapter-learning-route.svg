<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">第 1 章学习路线</title><desc id="desc">从性能增长转向并行开始，依次评估收益、识别负载、形成并行化判断卡。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 20px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="400" fill="#f8fafc"/><text class="title" x="55" y="58">第 1 章：从性能压力到并行化判断</text><text class="sub" x="55" y="88">四节依次回答“为何需要、收益怎样算、哪些负载值得做、如何留下证据”。</text><rect x="55" y="150" width="220" height="100" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="87" y="190">1. 性能压力</text><text class="text" x="83" y="220">需要供给并行工作</text><path d="M275 200 H320" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="150" width="220" height="100" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="352" y="190">2. 收益尺度</text><text class="text" x="348" y="220">上限或规模增长</text><path d="M540 200 H585" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="150" width="220" height="100" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="617" y="190">3. 负载目标</text><text class="text" x="613" y="220">结构与性能证据</text><path d="M805 200 H850" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="150" width="220" height="100" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="882" y="190">4. 判断记录</text><text class="text" x="878" y="220">约束与下一步</text><path d="M960 250 V305" stroke="#1e3a5f" stroke-width="3" marker-end="url(#out)"/><rect x="720" y="305" width="480" height="52" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="out" x="825" y="338">产出：并行化判断卡</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker><marker id="out" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1e3a5f"/></marker></defs></svg>
