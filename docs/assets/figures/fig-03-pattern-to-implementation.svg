<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">从模式记录到实现与复测</title><desc id="desc">模式选择记录生成 Host 实现和测量计划，再以正确性、时间线和性能证据更新候选执行位置。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">模式记录不是结论，而是实现与复测的输入</text><text class="sub" x="55" y="88">先用 Host 实现验证任务与阶段控制，再用证据更新候选设备和优化方向。</text><rect x="65" y="155" width="220" height="105" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="95" y="195">模式选择记录</text><text class="text" x="95" y="225">任务、依赖、目标、风险</text><path d="M285 207 H350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="155" width="220" height="105" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="380" y="195">Host 实现</text><text class="text" x="380" y="225">线程、队列、线程池</text><path d="M570 207 H635" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="155" width="220" height="105" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="665" y="195">验证证据</text><text class="text" x="665" y="225">正确性、时间线、指标</text><path d="M855 207 H920" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="155" width="220" height="105" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="950" y="195">更新候选</text><text class="text" x="950" y="225">CPU、GPU、NPU 路径</text><path d="M1030 260 V330 H175 V260" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text class="out" x="425" y="365">第 4 章开始：将记录落到可运行的 Host 并行实现</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs></svg>
