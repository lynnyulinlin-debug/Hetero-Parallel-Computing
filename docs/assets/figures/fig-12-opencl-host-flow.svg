<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">OpenCL vec_add Host Device 流程</title><desc id="desc">Host 选择平台和设备，创建上下文和队列，构建 kernel，提交 buffer，设备执行并返回结果。</desc><style>.b{fill:#f8f7f2}.t{font:700 27px sans-serif;fill:#172033}.h{font:700 18px sans-serif;fill:#172033}.s{font:500 14px sans-serif;fill:#475569}.c{stroke-width:2}.x{fill:#e8eefc;stroke:#2563eb}.y{fill:#dcf5ed;stroke:#0f766e}.l{stroke:#475569;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#475569"/></marker></defs><rect class="b" width="1200" height="390" rx="24"/><text class="t" x="55" y="58">OpenCL 最小闭环：Host 组织，Device 执行，Host 校验</text><rect class="x c" x="55" y="120" width="310" height="180" rx="16"/><text class="h" x="80" y="160">Host：准备与提交</text><text class="s" x="80" y="195">platform -> device -> context -> queue</text><text class="s" x="80" y="222">加载 .cl，创建 a / b / c buffer</text><text class="s" x="80" y="249">enqueue NDRange kernel</text><rect class="y c" x="835" y="120" width="310" height="180" rx="16"/><text class="h" x="860" y="160">Device：数据并行</text><text class="s" x="860" y="195">每个 work-item 处理一个 i</text><text class="s" x="860" y="222">c[i] = a[i] + b[i]</text><text class="s" x="860" y="249">结果写回 c buffer</text><rect class="x c" x="425" y="120" width="350" height="180" rx="16"/><text class="h" x="450" y="160">Host：收口与证据</text><text class="s" x="450" y="195">readback -> 串行参考校验</text><text class="s" x="450" y="222">记录 platform、device、输入规模</text><text class="s" x="450" y="249">无平台/设备：明确 SKIP</text><line class="l" x1="365" y1="210" x2="415" y2="210"/><line class="l" x1="775" y1="210" x2="825" y2="210"/><text class="s" x="55" y="350">OpenCL 的价值是后端选择空间；它不保证跨设备性能一致，也不替代固定目标平台的原生运行时。</text></svg>
