<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">并行化判断记录卡</title><desc id="desc">记录工作单元、依赖、数据路径、粒度、正确性和测量口径，输出下一步工程动作。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">并行化记录卡：先写清约束，再选择实现</text><text class="sub" x="55" y="88">记录不是性能报告，而是下一步设计和测量的输入。</text><rect x="70" y="145" width="280" height="170" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="105" y="185">输入与工作单元</text><text class="text" x="105" y="220">负载、输入规模、独立单元</text><text class="text" x="105" y="255">依赖与候选粒度</text><rect x="460" y="145" width="280" height="170" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="495" y="185">数据与证据</text><text class="text" x="495" y="220">数据位置、参考实现</text><text class="text" x="495" y="255">指标与测量口径</text><rect x="850" y="145" width="280" height="170" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="885" y="185">约束与下一步</text><text class="text" x="885" y="220">最大风险：串行、同步或搬运</text><text class="out" x="885" y="260">决定先改哪里，再选实现</text><path d="M350 230 H460 M740 230 H850" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs></svg>
