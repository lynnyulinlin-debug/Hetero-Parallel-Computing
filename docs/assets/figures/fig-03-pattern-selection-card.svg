<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">从任务描述到模式选择记录</title><desc id="desc">模式选择记录先写任务、依赖和目标，再形成候选模式与验证证据。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 20px sans-serif;fill:#172033}</style>
  <rect width="1200" height="410" fill="#f8fafc"/><text class="title" x="55" y="58">模式选择记录：先描述问题，再讨论执行位置</text><text class="sub" x="55" y="88">记录卡不是设备推荐表；它把影响选型的条件按顺序留下来，方便复查与测量。</text>
  <rect x="55" y="160" width="190" height="95" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="82" y="198">任务与输入</text><text class="text" x="82" y="228">工作单元是什么？</text><path d="M245 207h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="310" y="160" width="190" height="95" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="337" y="198">依赖与数据</text><text class="text" x="337" y="228">谁等待谁？</text><path d="M500 207h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="565" y="160" width="190" height="95" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="592" y="198">系统目标</text><text class="text" x="592" y="228">延迟、吞吐或功耗？</text><path d="M755 207h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="820" y="160" width="145" height="95" rx="14" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="847" y="198">候选模式</text><text class="text" x="847" y="228">怎样拆分？</text><path d="M965 207h45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1030" y="160" width="115" height="95" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text class="head" x="1050" y="198">验证</text><text class="text" x="1045" y="228">证据是什么？</text>
  <text class="text" x="255" y="335">CPU、GPU、NPU 等执行位置只能在候选模式之后比较，并由验证结果确认。</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
</svg>
