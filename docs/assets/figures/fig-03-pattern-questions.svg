<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">从输入输出关系识别基本模式</title><desc id="desc">通过输入是否独立、结果是否合并、是否分发或汇聚，识别 Map、Reduce、Scatter 和 Gather 模式。</desc><style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.out{font:700 18px sans-serif;fill:#1e3a5f}</style><rect width="1200" height="420" fill="#f8fafc"/><text class="title" x="55" y="58">模式问题卡：先问输入、输出和依赖</text><text class="sub" x="55" y="88">模式是候选描述，不替代后续的数据路径与同步判断。</text><rect x="65" y="155" width="235" height="115" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="95" y="195">输入能独立处理？</text><text class="out" x="95" y="235">是：Map</text><rect x="345" y="155" width="235" height="115" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="375" y="195">结果需要合并为一个？</text><text class="out" x="375" y="235">是：Reduce</text><rect x="625" y="155" width="235" height="115" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="655" y="195">工作需要分给执行者？</text><text class="out" x="655" y="235">是：Scatter</text><rect x="905" y="155" width="235" height="115" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="935" y="195">分散结果需要收回？</text><text class="out" x="935" y="235">是：Gather</text><text class="text" x="300" y="350">同一阶段可同时出现多个答案；下一步继续检查阶段依赖、数据位置和系统目标。</text></svg>
