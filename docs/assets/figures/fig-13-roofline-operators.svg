<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Roofline operator placement">
<style>.bg{fill:#f8f7f2}.t{font-family:Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.l{font-size:17px;font-weight:700}.s{font-size:14px;fill:#475569}.axis{stroke:#475569;stroke-width:3}.roof{stroke:#e85d04;stroke-width:5;fill:none}.dot1{fill:#2563eb}.dot2{fill:#7c3aed}.dot3{fill:#0f766e}</style>
<rect class="bg" width="1200" height="560" rx="24"/><text class="t h" x="50" y="60">Roofline: Match the Optimization to the Bottleneck</text><text class="t s" x="50" y="88">Conceptual placement only. Real coordinates require measured bandwidth, peak compute and operator intensity.</text>
<line class="axis" x1="150" y1="450" x2="1080" y2="450"/><line class="axis" x1="150" y1="450" x2="150" y2="145"/><text class="t s" x="945" y="485">arithmetic intensity</text><text class="t s" x="55" y="155">performance</text>
<path class="roof" d="M155 440L635 210L1050 210"/><text class="t l" x="320" y="330">bandwidth ceiling</text><text class="t l" x="760" y="195">compute ceiling</text>
<circle class="dot1" cx="330" cy="360" r="10"/><text class="t l" x="350" y="365">vec_add</text><text class="t s" x="350" y="387">low intensity: reduce traffic</text>
<circle class="dot2" cx="505" cy="285" r="10"/><text class="t l" x="525" y="290">reduce</text><text class="t s" x="525" y="312">bandwidth plus synchronization</text>
<circle class="dot3" cx="820" cy="245" r="10"/><text class="t l" x="840" y="250">GEMM</text><text class="t s" x="840" y="272">high intensity: improve reuse and occupancy</text>
<text class="t s" x="150" y="525">Use the model to decide whether to optimize data movement, synchronization, or arithmetic utilization before changing code.</text>
</svg>
