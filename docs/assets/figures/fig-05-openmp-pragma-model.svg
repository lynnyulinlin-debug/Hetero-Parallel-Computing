<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
 <title id="title">OpenMP pragma model</title><desc id="desc">A pragma is translated by the compiler into calls to an OpenMP runtime which schedules a team of threads.</desc>
 <style>text{font-family:Arial,sans-serif;fill:#18324a}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.code{font-family:monospace;font-size:17px;fill:#234e69}.note{font-size:14px;fill:#527084}.source{fill:#e5f1f9;stroke:#2979a9;stroke-width:2}.compiler{fill:#eef4e4;stroke:#619243;stroke-width:2}.runtime{fill:#fff0dc;stroke:#dc861f;stroke-width:2}.thread{fill:#f3eaf1;stroke:#a6638e;stroke-width:2}.line{fill:none;stroke:#6d8291;stroke-width:3}.arrow{fill:#6d8291}</style>
 <rect width="960" height="330" fill="#f8f7f2"/><text x="42" y="49" class="title">OpenMP turns a loop annotation into runtime work</text>
 <rect x="50" y="104" width="206" height="92" rx="10" class="source"/><text x="79" y="137" class="code">#pragma omp</text><text x="79" y="161" class="code">parallel for</text><text x="79" y="184" class="note">parallel intent in source</text>
 <rect x="346" y="104" width="170" height="92" rx="10" class="compiler"/><text x="386" y="143" class="label">Compiler</text><text x="371" y="169" class="note">lowering and checks</text>
 <rect x="606" y="104" width="170" height="92" rx="10" class="runtime"/><text x="633" y="143" class="label">OMP runtime</text><text x="628" y="169" class="note">team and schedule</text>
 <rect x="807" y="80" width="100" height="42" rx="8" class="thread"/><rect x="807" y="144" width="100" height="42" rx="8" class="thread"/><rect x="807" y="208" width="100" height="42" rx="8" class="thread"/><text x="831" y="107" class="label">T0</text><text x="831" y="171" class="label">T1</text><text x="831" y="235" class="label">T2</text>
 <path d="M256 150H326" class="line"/><path d="M326 150l-12-7v14z" class="arrow"/><path d="M516 150H586" class="line"/><path d="M586 150l-12-7v14z" class="arrow"/><path d="M776 150h14V101h17" class="line"/><path d="M776 150h31" class="line"/><path d="M776 150h14v79h17" class="line"/>
 <text x="50" y="285" class="note">The pragma states what may run in parallel; compiler and runtime decide how to create, divide and synchronize the thread team.</text>
</svg>
