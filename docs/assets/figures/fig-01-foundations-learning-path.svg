<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">第一篇学习路径</title><desc id="desc">第一篇依次建立并行收益、并发正确性和负载模式三个判断层次。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 22px sans-serif;fill:#172033}.out{font:700 17px sans-serif;fill:#1e3a5f}</style>
  <rect width="1200" height="430" fill="#f8fafc"/><text class="title" x="55" y="58">第一篇：按“是否值得、是否正确、怎样拆分”建立基础</text><text class="sub" x="55" y="88">每一章只交付一个可复查的判断产物，下一篇再把它们变成 Host 代码。</text>
  <rect x="55" y="145" width="300" height="165" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="85" y="190">第1章：性能约束</text><text class="text" x="85" y="225">问题：值得并行吗？</text><text class="out" x="85" y="270">产出：并行化判断卡</text>
  <path d="M355 228 H435" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="455" y="145" width="300" height="165" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="485" y="190">第2章：并发正确性</text><text class="text" x="485" y="225">问题：共享状态安全吗？</text><text class="out" x="485" y="270">产出：队列时序图</text>
  <path d="M755 228 H835" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="855" y="145" width="290" height="165" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="885" y="190">第3章：负载模式</text><text class="text" x="885" y="225">问题：工作怎样拆分？</text><text class="out" x="885" y="270">产出：模式选择记录卡</text>
  <text class="text" x="350" y="375">下一步：第4-7章把任务、循环和数据放到 Host 控制面中实现与验证。</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
</svg>
