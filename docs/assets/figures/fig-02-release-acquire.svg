<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">数据发布先于消费者读取</title>
  <desc id="desc">生产者写入数据后发布就绪状态，消费者确认就绪状态后读取数据。</desc>
  <style>
    .title { font: 700 28px sans-serif; fill: #172033; }
    .sub { font: 16px sans-serif; fill: #526070; }
    .head { font: 700 21px sans-serif; fill: #172033; }
    .text { font: 17px sans-serif; fill: #334155; }
    .label { font: 700 15px sans-serif; fill: #ffffff; }
  </style>
  <rect width="1200" height="400" fill="#f8fafc"/>
  <text class="title" x="55" y="58">先发布数据，再发布“就绪”；先确认“就绪”，再读取数据</text>
  <text class="sub" x="55" y="88">发布/获取关系把两个线程的关键步骤连接为一条可推理的顺序。</text>
  <rect x="70" y="145" width="210" height="90" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="98" y="184">生产者写数据</text>
  <text class="text" x="98" y="213">任务内容完成</text>
  <path d="M280 190 H365" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="385" y="145" width="210" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="408" y="160" width="58" height="26" rx="13" fill="#2563eb"/>
  <text class="label" x="422" y="179">发布</text>
  <text class="head" x="408" y="216">发布就绪标记</text>
  <path d="M595 190 H680" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="700" y="145" width="210" height="90" rx="14" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="723" y="160" width="58" height="26" rx="13" fill="#8b5cf6"/>
  <text class="label" x="737" y="179">获取</text>
  <text class="head" x="723" y="216">确认就绪标记</text>
  <path d="M910 190 H995" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1015" y="145" width="150" height="90" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="head" x="1037" y="184">读取数据</text>
  <text class="text" x="1037" y="213">安全使用任务</text>
  <rect x="230" y="290" width="740" height="54" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="text" x="258" y="324">错误顺序：先发布就绪标记、再写数据。消费者可能读到未完成的数据。</text>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
</svg>
