<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">任务交接的发布检查卡</title>
  <desc id="desc">任务交接需要依次检查数据完成、状态发布、消费者确认以及阶段屏障的适用范围。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:17px sans-serif;fill:#475569}.head{font:700 21px sans-serif;fill:#172033}.num{font:700 17px sans-serif;fill:#fff}.note{font:700 17px sans-serif;fill:#9a3412}</style>
  <rect width="1200" height="470" fill="#f8fafc"/>
  <text class="title" x="55" y="58">任务交接：按四项检查确认可见性边界</text>
  <text class="sub" x="55" y="88">前 3 项构成一次任务交接；第 4 项只用于所有线程必须同步到达的阶段边界。</text>
  <rect x="55" y="150" width="245" height="145" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="88" cy="184" r="17" fill="#2563eb"/><text class="num" x="83" y="190">1</text><text class="head" x="118" y="190">数据先完成</text><text class="text" x="82" y="230">任务内容写入完毕</text><text class="text" x="82" y="260">再改变就绪状态</text>
  <path d="M300 222 H350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="350" y="150" width="245" height="145" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <circle cx="383" cy="184" r="17" fill="#16a34a"/><text class="num" x="378" y="190">2</text><text class="head" x="413" y="190">状态再发布</text><text class="text" x="377" y="230">使用 release 或等价锁</text><text class="text" x="377" y="260">建立发布边界</text>
  <path d="M595 222 H645" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="645" y="150" width="245" height="145" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
  <circle cx="678" cy="184" r="17" fill="#8b5cf6"/><text class="num" x="673" y="190">3</text><text class="head" x="708" y="190">消费者确认</text><text class="text" x="672" y="230">acquire 观察就绪</text><text class="text" x="672" y="260">然后读取任务数据</text>
  <rect x="940" y="150" width="205" height="145" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="973" cy="184" r="17" fill="#ea580c"/><text class="num" x="968" y="190">4</text><text class="head" x="1003" y="190">可选屏障</text><text class="text" x="967" y="230">仅在全体线程</text><text class="text" x="967" y="260">必须到齐时使用</text>
  <rect x="150" y="355" width="900" height="55" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="note" x="218" y="389">不要用“状态是原子的”代替发布协议，也不要用阶段屏障代替一对一任务交接。</text>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
</svg>
