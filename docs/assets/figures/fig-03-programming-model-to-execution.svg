<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">从并行模式到可观测性能的分层</title><desc id="desc">并行模式、编程模型、编译、目标接口和运行时依次影响最终执行与性能证据。</desc>
  <style>.title{font:700 28px sans-serif;fill:#172033}.sub,.text{font:16px sans-serif;fill:#475569}.head{font:700 20px sans-serif;fill:#172033}.note{font:700 17px sans-serif;fill:#1e3a5f}</style>
  <rect width="1200" height="440" fill="#f8fafc"/><text class="title" x="55" y="58">从并行模式到执行结果：每一层回答不同问题</text><text class="sub" x="55" y="88">不要把源码、目标接口和实际性能混为一层；每层都需要对应证据。</text>
  <rect x="45" y="155" width="190" height="95" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="73" y="194">并行模式</text><text class="text" x="73" y="225">工作怎样拆分？</text>
  <path d="M235 202h35" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="290" y="155" width="190" height="95" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="318" y="194">编程模型</text><text class="text" x="318" y="225">怎样表达意图？</text>
  <path d="M480 202h35" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="535" y="155" width="190" height="95" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="563" y="194">编译或图编译</text><text class="text" x="563" y="225">怎样转换与优化？</text>
  <path d="M725 202h35" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="780" y="155" width="170" height="95" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text class="head" x="808" y="194">目标接口</text><text class="text" x="808" y="225">面向谁执行？</text>
  <path d="M950 202h35" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1005" y="155" width="150" height="95" rx="14" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text class="head" x="1027" y="194">运行时</text><text class="text" x="1027" y="225">实际怎样运行？</text>
  <rect x="245" y="315" width="710" height="54" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text class="note" x="290" y="349">证据要对层：编译报告、转换报告、性能时间线或设备复测</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
</svg>
